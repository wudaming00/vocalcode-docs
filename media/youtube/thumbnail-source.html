<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#08080c;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.frame{position:relative;width:1280px;height:720px;padding:62px 70px;background:radial-gradient(circle at 80% 25%,rgba(113,72,255,.25),transparent 35%),radial-gradient(circle at 52% 105%,rgba(255,151,77,.26),transparent 47%),linear-gradient(135deg,#07070a,#0d0d15);isolation:isolate}.frame:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.27;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}.brand{display:flex;align-items:center;gap:17px;font-size:25px;font-weight:800;letter-spacing:.14em}.brand img{width:56px;height:56px}.brand b{color:#ff9d4d}.tag{display:inline-block;margin-top:74px;padding:10px 16px;border:1px solid rgba(255,157,77,.52);border-radius:999px;color:#ffb477;background:rgba(255,157,77,.08);font-size:18px;font-weight:800;letter-spacing:.15em}.title{margin:20px 0 0;max-width:850px;font-size:79px;line-height:.98;font-weight:830;letter-spacing:-.055em}.title em{font-style:normal;background:linear-gradient(90deg,#ff974d,#ffd4af);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{margin-top:26px;color:#c8c8d2;font-size:26px;font-weight:560}.logo{position:absolute;right:70px;top:164px;width:340px;height:340px;filter:drop-shadow(0 28px 72px rgba(255,151,77,.23))}.bottom{position:absolute;left:70px;right:70px;bottom:52px;display:flex;justify-content:space-between;align-items:center;color:#a5a5b2;font-size:20px}.price{color:#ffd2ad;font-weight:750}
</style>
</head>
<body>
<main class="frame">
  <div class="brand"><img src="logo.png" alt=""><div>VOCAL<b>CODE</b></div></div>
  <div class="tag">ON-DEVICE VOICE INPUT</div>
  <h1 class="title">Voice-code your<br><em>next AI prompt.</em></h1>
  <p class="sub">Hold. Speak. Release. Clean text lands in your editor.</p>
  <img class="logo" src="logo.png" alt="VocalCode logo">
  <div class="bottom"><span>Windows · Apple silicon Mac</span><span class="price">$4.99 once · 30-day trial</span></div>
</main>
</body>
</html>
